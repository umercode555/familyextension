<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;
--bg:#f0f2f5;--cd:#fff;--tx:#111b21;--sub:#667781;--ln:#e9edef;--ac:#00a884;--ac2:#008069;--chip:#f5f6f6;--sh:0 1px 3px rgba(11,20,26,.12),0 6px 20px rgba(11,20,26,.06)}
body[data-t=d]{--bg:#0b141a;--cd:#202c33;--tx:#e9edef;--sub:#8696a0;--ln:#2a3942;--chip:#111b21;--sh:0 1px 3px rgba(0,0,0,.4)}
nav{width:240px;background:var(--cd);border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:22px;font-weight:700;padding:6px 12px 18px;color:var(--ac2)}body[data-t=d] .logo{color:var(--ac)}
nav a{padding:12px 14px;border-radius:12px;cursor:pointer;font-size:15px;display:flex;gap:12px;align-items:center}nav a:hover{background:var(--chip)}nav a.on{background:var(--ac);color:#fff;font-weight:600}
main{flex:1;overflow:auto;padding:28px 36px}h1{margin:0 0 4px;font-size:28px}.sub{color:var(--sub);margin-bottom:22px}h2{font-size:17px;margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.st{grid-template-columns:repeat(4,1fr)}
.card{background:var(--cd);border-radius:20px;padding:20px;box-shadow:var(--sh);transition:.2s}.card:hover{transform:translateY(-2px)}
.big{font-size:34px;font-weight:700}.lbl{color:var(--sub);font-size:13px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c7e,#34b7f1);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.top{display:flex;gap:14px;align-items:center;margin-bottom:12px}.nm{font-size:19px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13.5px;margin:12px 0}.kv span{color:var(--sub);display:block;font-size:12px}
button,.btn{border:0;border-radius:22px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--tx);font-family:inherit}
button.p{background:var(--ac);color:#fff}button.d{color:#d93025}button:hover{filter:brightness(.95)}.acts{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--chip);border-radius:10px;padding:3px 10px;font-size:12px;margin-right:6px}
.ok{background:#d9fdd3;color:#1f7a4d}body[data-t=d] .ok{background:#005c4b;color:#e9edef}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--chip);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:13px;color:var(--sub)}#modal{position:fixed;inset:0;background:rgba(11,20,26,.6);display:none;align-items:center;justify-content:center;z-index:9}
.mb{background:var(--cd);border-radius:20px;padding:24px;width:520px;max-height:90vh;overflow:auto}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}.dot{width:10px;height:10px;border-radius:50%;flex:none}
audio{width:100%;height:34px;margin-top:8px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cd{background:var(--cd);border-radius:12px;min-height:84px;padding:6px 8px;font-size:12px;cursor:pointer;box-shadow:var(--sh)}.cd b{font-size:13px}.cd i{display:block;font-style:normal;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:40px}.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.06)}}
@media(max-width:800px){body{flex-direction:column-reverse}nav{width:100%;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--ln);overflow-x:auto;gap:2px}.logo{display:none}nav a{flex-direction:column;gap:2px;padding:8px 10px;font-size:11px;white-space:nowrap}main{padding:16px 14px}h1{font-size:23px}.grid,.st{grid-template-columns:1fr!important}.st{grid-template-columns:1fr 1fr!important}.mb{width:94vw;padding:18px}.cal{gap:3px}.cd{min-height:56px;padding:3px;font-size:10px}.kv{grid-template-columns:1fr 1fr}select{width:100%!important}}
.ic{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}button,.btn{display:inline-flex;align-items:center;gap:6px}h1 .ic{vertical-align:-3px;color:#ea4a5a}
</style></head><body><nav id="nav"></nav><main id="main"></main><div id="modal"></div><script src="lib.js"></script><script src="app.js"></script></body></html>
