name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    defaults:
      run:
        shell: bash
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check repo layout
        working-directory: .
        run: |
          if [ ! -f android-app/package.json ]; then
            echo "::error title=Wrong folder layout::android-app/package.json not found. Upload the CONTENTS of the kin-system folder so that android-app/, chrome-extension/ and .github/ sit at the repo root."
            echo "Files at repo root:"; ls -la; exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -eo pipefail
          npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Align package versions with Expo SDK
        run: |
          set -eo pipefail
          npx expo install --fix 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Generate native Android project
        run: |
          set -eo pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Tune Gradle
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "android.enableMinifyInReleaseBuilds=false"
          } >> android/gradle.properties

      - name: Build release APK
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error title=No APK produced::Gradle finished but no .apk was found."; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/out" && cp "$APK" "$GITHUB_WORKSPACE/out/Kin.apk"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kin-apk
          path: out/Kin.apk
          if-no-files-found: error

      - name: Summary
        run: echo "### APK ready. Download artifact **Kin-apk** below." >> "$GITHUB_STEP_SUMMARY"

      # ---------- error reporting ----------
      - name: Explain failure
        if: failure()
        working-directory: .
        run: |
          echo "## Build failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            echo "### Key error lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "error:|Error:|ERR!|FAILURE|What went wrong|Execution failed|Could not |Cannot find|Unresolved|SyntaxError|ConfigError|not found|is not a valid" build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "### Last 60 log lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -nE "What went wrong|error:|ERR!|ConfigError|SyntaxError" build.log | head -10 | while IFS= read -r l; do echo "::error title=Build error::${l:0:400}"; done
            LAST=$(tail -3 build.log | tr '\n' ' '); echo "::error title=Last log lines::${LAST:0:400}"
          else
            echo "No build.log. Failure happened before the build steps. See the red step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
